name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "21 7 * * 2"
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest ruff
      - name: ruff
        run: ruff check costing seed tests
      - name: pytest
        run: python -m pytest -q
      - name: Sample sheets generate
        run: python -m seed.generate_sheets
      - name: Streamlit app imports cleanly
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('app/streamlit_app.py').read_text(encoding='utf-8')); print('ok')"
